CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_USE_DT_CODE_PARTITION=y

# The application writes the image_ok confirmation into the metadata page.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_HID=y
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=64
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0xF103
CONFIG_USB_DEVICE_MANUFACTURER="F103 Open Project"
CONFIG_USB_DEVICE_PRODUCT="F103 USB Application"
CONFIG_USB_DEVICE_SN="F103-APP-0001"
CONFIG_USB_DC_STM32_CLOCK_CHECK=n
CONFIG_WARN_DEPRECATED=n

