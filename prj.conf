CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_ASSERT=n
CONFIG_REBOOT=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_USE_DT_CODE_PARTITION=y

# The current USB Device stack is required on STM32F103 because its USB
# peripheral is not supported by the UDC-based stack.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_HID=y
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=64
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0xF103
CONFIG_USB_DEVICE_MANUFACTURER="F103 Open Project"
CONFIG_USB_DEVICE_PRODUCT="F103 USB IAP Bootloader"
CONFIG_USB_DEVICE_SN="F103-IAP-0001"
CONFIG_USB_DC_STM32_CLOCK_CHECK=n

# This project intentionally uses the deprecated device stack. Zephyr 4.4
# still provides it for STM32F1; keep the warning noise out of the build.
CONFIG_DEPRECATION_TEST=n
CONFIG_WARN_DEPRECATED=n

